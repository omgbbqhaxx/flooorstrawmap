<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f5f1"/>
  <!-- layer bands -->
  <rect x="0" y="0" width="1200" height="10" fill="#2f6fb0"/>
  <rect x="0" y="610" width="400" height="20" fill="#2f6fb0"/>
  <rect x="400" y="610" width="400" height="20" fill="#3d8c52"/>
  <rect x="800" y="610" width="400" height="20" fill="#c08a2e"/>
  <!-- flooor mark -->
  <g transform="translate(560, 96) scale(0.5)">
    <rect x="10" y="150" width="140" height="14" fill="#1a1a1a"/>
    <rect x="26" y="112" width="108" height="14" fill="#c08a2e"/>
    <rect x="42" y="74" width="76" height="14" fill="#3d8c52"/>
    <rect x="58" y="36" width="44" height="14" fill="#2f6fb0"/>
  </g>
  <text x="600" y="320" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="52" fill="#1a1a1a" letter-spacing="-1">flooor strawmap</text>
  <text x="600" y="365" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" fill="#75716a">a draft roadmap for the flooor protocol</text>
  <!-- release chips -->
  <g font-family="'IBM Plex Mono', Menlo, monospace" font-size="17" text-anchor="middle">
    <rect x="222" y="424" width="196" height="42" fill="#1a1a1a"/>
    <text x="320" y="451" fill="#f7f5f1">Cobalt &#183; Sep 2026</text>
    <rect x="430" y="424" width="106" height="42" fill="none" stroke="#a4863d"/>
    <text x="483" y="451" fill="#a4863d">$5M</text>
    <rect x="548" y="424" width="118" height="42" fill="none" stroke="#a4863d"/>
    <text x="607" y="451" fill="#a4863d">$10M</text>
    <rect x="678" y="424" width="130" height="42" fill="none" stroke="#a4863d"/>
    <text x="743" y="451" fill="#a4863d">$100M</text>
  </g>
  <text x="600" y="524" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="15" fill="#a8a39b">stages unlock at market cap, not on a date</text>
</svg>
