<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f5f1"/>
  <!-- layer bands -->
  <rect x="0" y="0" width="1200" height="10" fill="#c08a2e"/>
  <rect x="0" y="610" width="600" height="20" fill="#c08a2e"/>
  <rect x="600" y="610" width="600" height="20" fill="#2f6fb0"/>
