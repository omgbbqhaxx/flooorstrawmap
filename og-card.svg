    <rect x="633" y="424" width="130" height="42" fill="none" stroke="#a4863d"/>
    <text x="698" y="451" fill="#a4863d">$100M</text>
    <rect x="775" y="424" width="118" height="42" fill="none" stroke="#a4863d"/>
    <text x="834" y="451" fill="#a4863d">$1B+</text>
    <rect x="905" y="424" width="118" height="42" fill="none" stroke="#a4863d"/>
    <text x="964" y="451" fill="#a4863d">$1T+</text>
